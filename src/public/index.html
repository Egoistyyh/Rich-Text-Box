<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>作业6 - 排序服务与AI问答</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 背景装饰 -->
    <div class="bg-decoration">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <div class="main-container">
        <!-- 顶部标题区 -->
        <header class="header-section">
            <div class="header-content">
                <div class="logo">
                    <i class="bi bi-braces-asterisk"></i>
                </div>
                <div class="header-text">
                    <h1>Web高级开发</h1>
                    <p>排序服务与AI问答</p>
                </div>
            </div>
        </header>

        <!-- 天气卡片 -->
        <section class="weather-section glass-card">
            <div class="weather-main">
                <div class="weather-icon-wrapper">
                    <i class="bi bi-cloud-sun-fill" id="weatherIcon"></i>
                </div>
                <div class="weather-info">
                    <div class="location-row">
                        <i class="bi bi-geo-alt"></i>
                        <span id="locationName">正在获取位置...</span>
                    </div>
                    <div class="temp-row">
                        <span class="temperature" id="temperature">--°C</span>
                        <span class="weather-desc" id="weatherDesc">加载中...</span>
                    </div>
                    <div class="weather-details" id="weatherDetails">
                        <span><i class="bi bi-droplet"></i> --%</span>
                        <span><i class="bi bi-wind"></i> -- m/s</span>
                    </div>
                </div>
            </div>
            <button class="refresh-btn" id="refreshLocationBtn" title="刷新位置">
                <i class="bi bi-arrow-clockwise"></i>
            </button>
        </section>

        <!-- 主功能区 -->
        <div class="features-grid">
            <!-- 排序服务 -->
            <section class="feature-card glass-card">
                <div class="card-header-custom">
                    <div class="card-icon sort-icon">
                        <i class="bi bi-sort-numeric-down"></i>
                    </div>
                    <h2>数值排序服务</h2>
                </div>
                <div class="card-content">
                    <form id="sortForm">
                        <div class="input-group-custom">
                            <label for="numbersInput">输入数值</label>
                            <textarea 
                                id="numbersInput" 
                                placeholder="输入多个数值，用逗号、空格或换行分隔&#10;例如: 5, 2, 8, 1, 9"
                                rows="3"
                            ></textarea>
                        </div>
                        <div class="sort-options">
                            <label class="radio-option">
                                <input type="radio" name="sortOrder" value="asc" checked>
                                <span class="radio-custom"></span>
                                <span class="radio-label"><i class="bi bi-sort-up"></i> 升序</span>
                            </label>
                            <label class="radio-option">
                                <input type="radio" name="sortOrder" value="desc">
                                <span class="radio-custom"></span>
                                <span class="radio-label"><i class="bi bi-sort-down"></i> 降序</span>
                            </label>
                        </div>
                        <button type="submit" class="submit-btn sort-btn">
                            <i class="bi bi-play-fill"></i> 开始排序
                        </button>
                    </form>

                    <!-- 排序结果 -->
                    <div id="sortResult" class="result-section d-none">
                        <div class="result-divider"></div>
                        <div class="result-header">
                            <i class="bi bi-check-circle-fill"></i> 排序完成
                        </div>
                        <div class="result-item">
                            <span class="result-label">原始数据</span>
                            <div class="result-value" id="originalNumbers"></div>
                        </div>
                        <div class="result-item highlight">
                            <span class="result-label">排序结果 (<span id="sortOrderText"></span>)</span>
                            <div class="result-value" id="sortedNumbers"></div>
                        </div>
                        <div class="result-count">
                            共 <strong id="numberCount">0</strong> 个数值
                        </div>
                    </div>
                </div>
            </section>

            <!-- AI问答 -->
            <section class="feature-card glass-card">
                <div class="card-header-custom">
                    <div class="card-icon ai-icon">
                        <i class="bi bi-robot"></i>
                    </div>
                    <h2>DeepSeek AI 问答</h2>
                </div>
                <div class="card-content chat-card-content">
                    <!-- API Key -->
                    <div class="api-key-section">
                        <div class="input-group-custom">
                            <label for="apiKeyInput">
                                <i class="bi bi-key"></i> API Key
                                <a href="https://platform.deepseek.com/" target="_blank" class="get-key-link">获取</a>
                            </label>
                            <div class="password-input">
                                <input 
                                    type="password" 
                                    id="apiKeyInput" 
                                    placeholder="输入您的DeepSeek API Key"
                                >
                                <button type="button" id="toggleApiKey" class="toggle-password">
                                    <i class="bi bi-eye"></i>
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- 聊天区域 -->
                    <div class="chat-container" id="chatContainer">
                        <div class="chat-message system-message">
                            <div class="message-bubble">
                                <i class="bi bi-stars"></i>
                                欢迎使用 DeepSeek AI！请输入您的问题。
                            </div>
                        </div>
                    </div>

                    <!-- 输入区域 -->
                    <form id="chatForm" class="chat-input-form">
                        <input 
                            type="text" 
                            id="chatInput" 
                            placeholder="输入您的问题..."
                        >
                        <button type="submit" id="sendBtn">
                            <i class="bi bi-send-fill"></i>
                        </button>
                    </form>
                </div>
            </section>
        </div>

        <!-- 页脚 -->
        <footer class="footer-section">
            <p><i class="bi bi-code-slash"></i> Web高级开发 </p>
        </footer>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Marked.js for Markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- Highlight.js for code syntax highlighting -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github-dark.min.css">
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/core.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/javascript.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/python.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/css.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/html.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/json.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/bash.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
